[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otfmi"
dynamic = ["version"]
description = "Simulate FMUs from OpenTURNS"
readme = "README.rst"
dependencies = [
  "openturns",
  "numpy",
  "dill",
  "pythonfmu",
  "jinja2",
]
authors = [
  {name = "Sylvain Girard"},
  {name = "Julien Schueller"},
]
license = {text= "LGPL-3.0-or-later"}
classifiers = [
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
]
keywords = ["fmi", "modelica", "fmu"]

[project.optional-dependencies]
pyfmi = ["pyfmi"]
fmpy = ["fmpy", "packaging"]
all = ["pyfmi", "fmpy", "packaging"]
doc = ["numpydoc", "sphinx-gallery", "sphinx"]

[project.urls]
Homepage = "https://github.com/openturns/otfmi"
Documentation = "http://openturns.github.io/otfmi/master/"
Repository = "https://github.com/openturns/otfmi.git"

[project.scripts]
mo2fmu = "otfmi.mo2fmu:main"

[tool.hatch.version]
path = "otfmi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["otfmi"]

[tool.hatch.build.targets.sdist]
include = [
  "otfmi",
  "test",
  "doc",
  "README.rst",
  "ChangeLog",
  "COPYING",
  "COPYING.LESSER",
]
exclude = [
  "doc/_generated",
  "doc/auto_*",
]
